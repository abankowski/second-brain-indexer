# Include this inside the TLS-enabled server block. Define `indexer_api` once
# in nginx's http block: limit_req_zone $binary_remote_addr zone=indexer_api:10m rate=10r/m;
# Streamable HTTP MCP must keep its exact external path. SSE is optional in the
# current server responses, but these settings keep the proxy correct if a MCP
# session upgrades to an event stream later.
location = /indexer/mcp {
    proxy_pass http://127.0.0.1:9184/indexer/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    limit_req zone=indexer_api burst=20 nodelay;
}

location /indexer/ {
    proxy_pass http://127.0.0.1:9184;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    limit_req zone=indexer_api burst=20 nodelay;
    # Add one production authentication mechanism here: auth_request, mTLS, or Basic Auth.
}
